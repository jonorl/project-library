<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Library</title>
</head>
<body>
    <div class="container">

        <button data-open-modal>Add New Book</button>

        <dialog data-modal>
            <form class="addNewBook">
                <fieldset>
                    <legend>New Book</legend>
                    <div class="addNewBookContainer">
                        <label for="name">Name:&nbsp;<input id="name" type="text">
                        <span class="error" aria-live="polite"></span></label>
                        <label for="author">Author:&nbsp;<input id="author" type="text">
                        <span class="error" aria-live="polite"></span></label>
                        <label for="numberOfPages"># of pages:&nbsp;<input id="numberOfPages" type="number">
                        <span class="error" aria-live="polite"></span></label>
                        <label for="read">Read?<input id="read" type="checkbox">
                        <span class="error" aria-live="polite"></span></label>
                        <button class="add">Add</button>
                        <button class="cancel">Cancel</button>
                    </div>
                </fieldset>
            </form>
        </dialog>

        <div class="cardsContainer">

        </div>
    </div>

</body>
<script src="main.js" defer></script>
</html>
